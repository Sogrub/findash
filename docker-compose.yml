services:
  postgres:
    image: postgres:16-alpine
    container_name: findash_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: findash
      POSTGRES_PASSWORD: findash123
      POSTGRES_DB: findash
    ports:
      - "5433:5432"
    volumes:
      - findash_pgdata:/var/lib/postgresql/data

volumes:
  findash_pgdata:
